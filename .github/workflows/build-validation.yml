name: Build validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/software-licensing-partnerships]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Compile React application
        run: CI=true npm run build
